WORLDS: [world]               # survival world names
SPAWN-INTERVAL-MINUTES: 20
MAX-ACTIVE: 12                # per all worlds combined
MIN-DISTANCE-FROM-SPAWN: 150  # keep chests out of spawn protection
MAX-DISTANCE-FROM-SPAWN: 2500 # also clamped to the world border
DESPAWN-MINUTES: 60           # unopened chests vanish after this
ANNOUNCE: true
ANNOUNCE-PRECISION: 100       # coords in the announcement are rounded to this many blocks (0 = exact)
PARTICLES: true               # glowing column visible when a player is within 48 blocks
# Chance weights for the rarity of each new chest.
RARITY-WEIGHTS: {BASIC: 50, UNCOMMON: 25, RARE: 14, EPIC: 8, LEGENDARY: 3}
ROLLS:                        # item stacks rolled per chest: [min, max]
  BASIC: [2, 4]
  UNCOMMON: [3, 5]
  RARE: [3, 6]
  EPIC: [4, 6]
  LEGENDARY: [5, 8]
# LOOT entries: "MATERIAL:minAmount-maxAmount:weight". Same names as the store tiers:
# BASIC=Fugu, UNCOMMON=Kente, RARE=Adinkra, EPIC=Asante Gold, LEGENDARY=Golden Stool.
LOOT:
  BASIC:
    - "BREAD:2-6:30"
    - "COAL:4-12:25"
    - "IRON_INGOT:1-4:20"
    - "ARROW:8-24:15"
    - "STONE_SWORD:1-1:5"
    - "LEATHER_CHESTPLATE:1-1:5"
  UNCOMMON:
    - "COOKED_BEEF:4-10:25"
    - "IRON_INGOT:3-8:25"
    - "GOLD_INGOT:2-6:20"
    - "IRON_SWORD:1-1:8"
    - "IRON_CHESTPLATE:1-1:8"
    - "EXPERIENCE_BOTTLE:3-8:14"
  RARE:
    - "DIAMOND:1-3:25"
    - "GOLDEN_APPLE:1-3:20"
    - "EXPERIENCE_BOTTLE:8-16:20"
    - "DIAMOND_SWORD:1-1:8"
    - "DIAMOND_PICKAXE:1-1:8"
    - "ENDER_PEARL:2-5:19"
  EPIC:
    - "DIAMOND:3-8:25"
    - "ENCHANTED_GOLDEN_APPLE:1-1:8"
    - "NETHERITE_SCRAP:1-3:15"
    - "DIAMOND_CHESTPLATE:1-1:12"
    - "DIAMOND_BOOTS:1-1:12"
    - "TOTEM_OF_UNDYING:1-1:10"
    - "EXPERIENCE_BOTTLE:16-32:18"
  LEGENDARY:
    - "NETHERITE_INGOT:1-3:20"
    - "NETHERITE_SWORD:1-1:12"
    - "NETHERITE_CHESTPLATE:1-1:12"
    - "ELYTRA:1-1:8"
    - "TOTEM_OF_UNDYING:1-2:15"
    - "ENCHANTED_GOLDEN_APPLE:1-3:15"
    - "DIAMOND_BLOCK:1-3:18"
