  GATE-LEVEL-TOO-LOW: '&cYou need to be level {required} to enter this Gate.'

SOUNDS:
  LEVEL-UP: ENTITY_PLAYER_LEVELUP
  AWAKENING: ENTITY_ENDER_DRAGON_GROWL
  GATE-OPEN: BLOCK_END_PORTAL_SPAWN
  GATE-CLEAR: UI_TOAST_CHALLENGE_COMPLETE
  GATE-FAIL: ENTITY_WITHER_HURT
