name: GhanaRealmsShops
version: '${project.version}'
main: com.ghanarealms.shops.GhanaRealmsShops
api-version: '1.21'
author: GhanaRealms
description: Sign-based player shops attached to chests - distinct from UltimateDonutSMP's global auction house
softdepend: [Vault]

commands:
  shophelp:
    description: How to create a sign shop
    usage: /shophelp
    permission: ghanarealmsshops.use

  servershop:
    description: Create and manage walk-in server shop chests
    usage: /servershop <create|remove|list|open|reload>
    permission: ghanarealmsshops.admin

permissions:
  ghanarealmsshops.use:
    default: true
  ghanarealmsshops.create:
    default: true
  ghanarealmsshops.admin:
    default: op
