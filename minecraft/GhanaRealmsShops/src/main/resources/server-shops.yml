# Walk-in server shops. Each CATEGORIES entry is one shop. Bind a chest to it with:
#   /servershop create <category>      (look at an EMPTY chest/barrel)
#   /servershop create hub             (a chest that lists every category)
#
# ITEMS: material = Bukkit material name; buy = price to BUY one from the shop;
#        sell = price the shop pays for one. Use -1 (or leave out) to disable a side.
# Prices are in the Vault economy (the ₵ you earn in-game) - these numbers are PLACEHOLDERS, tune
# them to your economy. Edit, then /servershop reload. Selling only accepts plain (un-renamed,
# un-enchanted) items. 'hub' is a reserved id. Max 28 categories in the hub, 45 items per menu page.

