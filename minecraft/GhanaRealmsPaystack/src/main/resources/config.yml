# ==============================================================================
# GhanaRealmsPaystack Configuration
# ==============================================================================
# Get your keys from https://dashboard.paystack.com/#/settings/developer
# NEVER commit or share your SECRET key. Use the TEST keys (sk_test_.../pk_test_...)
# until you've confirmed checkout + webhook flow works end to end.

PAYSTACK:
  SECRET-KEY: 'sk_test_REPLACE_ME'
  PUBLIC-KEY: 'pk_test_REPLACE_ME'
  CURRENCY: 'GHS'
  # Base URL of your own web page that hosts the Paystack checkout button/redirect.
  # This plugin only INITIALIZES the transaction and gives the player a link + a
  # reference code to run /buy confirm with; it does not render a checkout page
  # itself (Minecraft can't open a browser for the player). See the README.
  CALLBACK-URL: 'https://your-website.example/ghanarealms/payment-complete'

WEBHOOK:
  # A lightweight built-in HTTP server (JDK's com.sun.net.httpserver - no extra
  # dependency) that listens for Paystack's webhook POST on this port/path.
  # Your firewall/reverse proxy must forward external traffic to this port.
  # This serves the in-game /buy command's OWN purchases - it is separate
  # from BRIDGE below, which delivers purchases made through the website.
  ENABLED: true
  PORT: 8085
  PATH: '/ghanarealms/paystack/webhook'

BRIDGE:
  # If you've also deployed the GhanaRealms web store (see /web in the repo),
  # this plugin can ALSO poll it for purchases made through the website and
  # deliver them in-game - the two purchase paths (in-game /buy and the
  # website) are independent and both funnel into the same delivery logic.
  # Leave STORE-BASE-URL blank/REPLACE_ME to disable this - the plugin
  # works fine with only the in-game /buy flow if you don't want a website.
  ENABLED: false
  STORE-BASE-URL: 'https://your-store-domain.example'
  BRIDGE-SECRET: 'REPLACE_ME_MUST_MATCH_MINECRAFT_BRIDGE_SECRET_IN_WEB_ENV'
  POLL-INTERVAL-SECONDS: 30

PACKAGES:
  STARTER:
    PRICE-GHS: 20
    DISPLAY-NAME: '&aStarter Pack'
    GIVE-MONEY: 5000
    COMMANDS: []
  VIP:
    PRICE-GHS: 50
    DISPLAY-NAME: '&6VIP Rank'
    GIVE-MONEY: 15000
    COMMANDS:
      - 'lp user {player} parent add vip'
  CHAMPION:
    PRICE-GHS: 150
    DISPLAY-NAME: '&dChampion Rank'
    GIVE-MONEY: 50000
    COMMANDS:
      - 'lp user {player} parent add champion'

DATABASE:
  # SQLite file, relative to the plugin's data folder. Swap for a real DB driver
  # yourself if you outgrow SQLite - the schema is documented in the README.
  FILE: 'purchases.db'

MESSAGES:
  CHECKOUT-CREATED:
    - '&aCheckout created! Reference: &f{reference}'
    - '&aComplete payment here: &f{authorization_url}'
    - '&7Once paid, Paystack notifies the server automatically - no need to run anything else.'
  PAYMENT-SUCCESS: '&aPayment confirmed! Thank you for supporting GhanaRealms, {player}.'
  PAYMENT-FAILED: '&cPayment failed or was not completed.'
  DUPLICATE-TRANSACTION: '&cThis transaction has already been processed.'
  UNKNOWN-PACKAGE: '&cUnknown package. Use /buy to see available packages.'
